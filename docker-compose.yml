# Local development stack: Postgres + Django API + Vite frontend.
# Usage: docker compose up --build
# Then open http://localhost:5173 (demo logins seeded, password: demopass123)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mboa
      POSTGRES_PASSWORD: mboa
      POSTGRES_DB: mboa_market
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mboa -d mboa_market"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: compose-dev-secret-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://mboa:mboa@db:5432/mboa_market
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
